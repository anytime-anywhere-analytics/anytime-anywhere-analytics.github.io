name: Build and deploy

# The build pulls the Google Sheet CMS and the Drive assets folder (npm prebuild), so the
# daily run is what publishes content edits. If the pull fails validation the build fails
# and the last good deploy stays up.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # daily, 05:00/06:00 Copenhagen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CMS_URL: ${{ secrets.CMS_URL }}
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
