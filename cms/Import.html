<!doctype html>
<html>
<head>
<base target="_top">
<style>
  body { margin: 0; padding: 16px 20px; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #111; }
  code { background: #f3f3f3; padding: 1px 5px; border-radius: 4px; }
  input[type=file] { display: block; margin: 12px 0; }
  ul { margin: 8px 0; padding-left: 18px; }
  .msg { white-space: pre-wrap; margin-top: 10px; font-size: 13px; }
  .err { color: #b00020; } .ok { color: #1a7f37; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: block; margin: 8px 0; }
</style>
</head>
<body>
  <p>Pick the site's <code>src/data/*.json</code> files (any subset). Each file fills the tab of the same name:
    <code>site</code> → Site, <code>pillars</code> → Pillars, … <code>publications</code> → Publications.</p>
  <input type="file" id="files" multiple accept=".json,application/json">
  <label><input type="radio" name="mode" value="replace" checked> Replace the whole tab</label>
  <label><input type="radio" name="mode" value="merge"> Merge — update rows with the same id, append new ones</label>
  <button id="go" disabled>Import</button>
  <div class="msg" id="msg"></div>
<script>
  const TAB = { site: "Site", pillars: "Pillars", testbeds: "Testbeds", members: "Members", posts: "Posts", publications: "Publications", stats: "Stats" };
  const files = document.getElementById("files"), go = document.getElementById("go"), msg = document.getElementById("msg");
  let payload = null;
  files.addEventListener("change", async () => {
    payload = {}; const lines = [];
    for (const f of files.files) {
      const tab = TAB[f.name.replace(/\.json$/i, "").toLowerCase()];
      if (!tab) { lines.push(`${f.name}: not a content file, skipped`); continue; }
      try { payload[tab] = JSON.parse(await f.text()); lines.push(`${f.name} → ${tab}`); }
      catch (e) { lines.push(`${f.name}: ${e.message}`); }
    }
    msg.className = "msg"; msg.textContent = lines.join("\n"); go.disabled = !Object.keys(payload).length;
  });
  go.addEventListener("click", () => {
    go.disabled = true; msg.className = "msg"; msg.textContent = "Importing… (large tabs take a minute)";
    const replace = document.querySelector("input[name=mode]:checked").value === "replace";
    google.script.run
      .withSuccessHandler((r) => { msg.className = "msg ok"; msg.textContent = "Done\n" + r; })
      .withFailureHandler((e) => { go.disabled = false; msg.className = "msg err"; msg.textContent = e.message; })
      .importJson(payload, replace);
  });
</script>
</body>
</html>
